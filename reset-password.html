<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e3a8a">
    <title>WS Form - Nuova password</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color:#1e3a8a; --primary-light:#eff6ff;
            --accent-red:#b91c1c; --bg-color:#f1f5f9;
            --card-bg:#fff; --border-color:#cbd5e1; --text-color:#0f172a;
        }
        *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
        body{background:var(--bg-color);color:var(--text-color);min-height:100vh;padding:14px;display:flex;align-items:center;justify-content:center}
        .container{width:100%;max-width:430px}
        .card{background:var(--card-bg);padding:22px 18px 18px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.05);border-top:5px solid var(--primary-color);text-align:center}
        .logo{width:58px;height:58px;margin:0 auto 12px;border-radius:14px;background:var(--primary-light);color:var(--primary-color);display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:800}
        h1{color:var(--primary-color);font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
        .subtitle{color:#64748b;font-size:12px;font-weight:600;margin-bottom:20px}
        .group{text-align:left;margin-bottom:12px}
        label{display:block;font-size:11px;font-weight:700;color:#64748b;margin-bottom:4px;text-transform:uppercase}
        input{padding:11px 12px;border:1.5px solid var(--border-color);border-radius:8px;font-size:15px;width:100%;background:#f8fafc;outline:none}
        input:focus{background:#fff;border-color:var(--primary-color);box-shadow:0 0 0 3px rgba(30,58,138,.08)}
        button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--primary-color);color:#fff;font-size:14px;font-weight:800;cursor:pointer}
        button:disabled{opacity:.65}
        .message{display:none;margin-top:12px;padding:9px 11px;border-radius:8px;font-size:12px;font-weight:700;text-align:left}
        .error{background:#fef2f2;border:1px solid #fecaca;color:var(--accent-red)}
        .ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
        .footer{text-align:center;margin-top:12px;color:#94a3b8;font-size:10px;font-weight:600}
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="logo">WS</div>
        <h1>NUOVA PASSWORD</h1>
        <div class="subtitle">Imposta una nuova password per WS Form</div>

        <form id="resetForm">
            <div class="group">
                <label for="password">Nuova password</label>
                <input id="password" type="password" autocomplete="new-password" required minlength="6" placeholder="Inserisci nuova password">
            </div>
            <div class="group">
                <label for="confirm">Conferma password</label>
                <input id="confirm" type="password" autocomplete="new-password" required minlength="6" placeholder="Ripeti la password">
            </div>
            <button id="saveButton" type="submit">SALVA PASSWORD</button>
            <div id="error" class="message error"></div>
            <div id="ok" class="message ok"></div>
        </form>
    </div>
    <div class="footer">WS Form</div>
</div>

<script>
const SUPABASE_URL = "https://uojxohvixlcxftpavieu.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_u-ka1YHQS-pTFTIfDsaXcw_3pjStYKh";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const form = document.getElementById("resetForm");
const errorBox = document.getElementById("error");
const okBox = document.getElementById("ok");
const button = document.getElementById("saveButton");

function showError(msg){ errorBox.textContent=msg; errorBox.style.display="block"; okBox.style.display="none"; }
function showOk(msg){ okBox.textContent=msg; okBox.style.display="block"; errorBox.style.display="none"; }

(async () => {
    const { data } = await client.auth.getSession();
    if (!data.session) showError("Il link di recupero non è valido o è scaduto. Richiedi una nuova email.");
})();

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const p = document.getElementById("password").value;
    const c = document.getElementById("confirm").value;
    errorBox.style.display="none"; okBox.style.display="none";

    if (p.length < 6) return showError("La password deve contenere almeno 6 caratteri.");
    if (p !== c) return showError("Le due password non coincidono.");

    button.disabled = true;
    button.textContent = "SALVATAGGIO...";

    const { error } = await client.auth.updateUser({ password: p });

    if (error) {
        showError(error.message || "Impossibile aggiornare la password.");
        button.disabled = false;
        button.textContent = "SALVA PASSWORD";
        return;
    }

    showOk("Password aggiornata. Puoi tornare alla pagina di accesso.");
    setTimeout(() => { window.location.href = "index.html"; }, 1800);
});
</script>
</body>
</html>
