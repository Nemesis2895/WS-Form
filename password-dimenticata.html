<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e3a8a">
    <title>WS Form</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color:#1e3a8a; --primary-light:#eff6ff;
            --accent-red:#b91c1c; --bg-color:#f1f5f9;
            --card-bg:#fff; --border-color:#cbd5e1; --text-color:#0f172a;
        }
        *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
        body{background:var(--bg-color);color:var(--text-color);min-height:100vh;padding:14px;display:flex;align-items:center;justify-content:center}
        .container{width:100%;max-width:430px}
        .card{background:var(--card-bg);padding:22px 18px 18px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.05);border-top:5px solid var(--primary-color);text-align:center}
        .logo{width:58px;height:58px;margin:0 auto 12px;border-radius:14px;background:var(--primary-light);color:var(--primary-color);display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:800}
        h1{color:var(--primary-color);font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
        .subtitle{color:#64748b;font-size:12px;font-weight:600;margin-bottom:20px}
        .group{text-align:left;margin-bottom:12px}
        label{display:block;font-size:11px;font-weight:700;color:#64748b;margin-bottom:4px;text-transform:uppercase}
        input{padding:11px 12px;border:1.5px solid var(--border-color);border-radius:8px;font-size:15px;width:100%;background:#f8fafc;outline:none}
        input:focus{background:#fff;border-color:var(--primary-color);box-shadow:0 0 0 3px rgba(30,58,138,.08)}
        button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--primary-color);color:#fff;font-size:14px;font-weight:800;cursor:pointer}
        button:disabled{opacity:.65}
        .message{display:none;margin-top:12px;padding:9px 11px;border-radius:8px;font-size:12px;font-weight:700;text-align:left}
        .error{background:#fef2f2;border:1px solid #fecaca;color:var(--accent-red)}
        .ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
        .footer{text-align:center;margin-top:12px;color:#94a3b8;font-size:10px;font-weight:600}
    </style>

<style id="responsive-mobile-tablet">
@media (max-width:600px){
  body{padding:10px;min-height:100dvh}
  .container{max-width:100%}
  .card{padding:20px 15px 16px}
  .logo{width:54px;height:54px;font-size:25px}
  h1{font-size:18px}
  input{font-size:16px;min-height:44px}
  button{min-height:46px}
}
@media (min-width:601px) and (max-width:1024px){
  body{padding:24px}
  .container{max-width:500px}
  .card{padding:28px 24px 22px}
}
</style>

</head>
<body>
<div class="container">
    <div class="card">
        <div class="logo">WS</div>
        <h1>WS FORM</h1><div class="subtitle">Procedura di recupero password</div>
        

        <form id="recoveryForm">
            <div id="requestSection">
                <div class="group">
                    <label for="username">Username</label>
                    <input id="username" type="text" autocomplete="username" autocapitalize="characters" spellcheck="false" required placeholder="Inserisci username">
                </div>
                <button id="requestButton" type="submit">INVIA EMAIL DI RECUPERO</button>
            </div>

            <div id="resetSection" style="display:none">
                <div class="group">
                    <label for="password">Nuova password</label>
                    <input id="password" type="password" autocomplete="new-password" minlength="6" placeholder="Inserisci nuova password">
                </div>
                <div class="group">
                    <label for="confirm">Conferma password</label>
                    <input id="confirm" type="password" autocomplete="new-password" minlength="6" placeholder="Ripeti la password">
                </div>
                <button id="saveButton" type="button">SALVA PASSWORD</button>
            </div>

            <div id="error" class="message error"></div>
            <div id="ok" class="message ok"></div>
        </form>
    </div>
    <div class="footer">WS Form</div>
</div>

<script>
const SUPABASE_URL = "https://uojxohvixlcxftpavieu.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_u-ka1YHQS-pTFTIfDsaXcw_3pjStYKh";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const recoveryForm = document.getElementById("recoveryForm");
const requestSection = document.getElementById("requestSection");
const resetSection = document.getElementById("resetSection");
const usernameInput = document.getElementById("username");
const requestButton = document.getElementById("requestButton");
const passwordInput = document.getElementById("password");
const confirmInput = document.getElementById("confirm");
const saveButton = document.getElementById("saveButton");
const errorBox = document.getElementById("error");
const okBox = document.getElementById("ok");

function showError(msg){ errorBox.textContent=msg; errorBox.style.display="block"; okBox.style.display="none"; }
function showOk(msg){ okBox.textContent=msg; okBox.style.display="block"; errorBox.style.display="none"; }
function clearMessages(){ errorBox.style.display="none"; okBox.style.display="none"; }

async function checkRecoverySession(){
    const { data, error } = await client.auth.getSession();
    if(error){ console.error("Recovery session error:", error.message); return; }

    if(data.session){
        requestSection.style.display="none";
        resetSection.style.display="block";
        passwordInput.required=true;
        confirmInput.required=true;
    }
}

checkRecoverySession();

// STEP 1: l'utente inserisce lo username e richiede l'email.
recoveryForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMessages();

    if(resetSection.style.display !== "none") return;

    const username=usernameInput.value.trim();
    if(!username){
        showError("Inserisci il tuo username.");
        usernameInput.focus();
        return;
    }

    requestButton.disabled=true;
    requestButton.textContent="INVIO...";

    try{
        const r=await fetch(SUPABASE_URL+"/functions/v1/auth-login",{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "apikey":SUPABASE_PUBLISHABLE_KEY
            },
            body:JSON.stringify({username:username,recovery:true})
        });
        const x=await r.json();

        if(!r.ok || !x.success){
            showError(x.error || "Impossibile inviare l'email di recupero.");
            return;
        }

        showOk("Se l'username è corretto, riceverai un'email con le istruzioni per reimpostare la password.");
        usernameInput.value="";
    }catch(e){
        console.error("Recovery request error:",e);
        showError("Errore di collegamento al server.");
    }finally{
        requestButton.disabled=false;
        requestButton.textContent="INVIA EMAIL DI RECUPERO";
    }
});

// STEP 2: dopo il click sul link ricevuto via email, impostazione nuova password.
saveButton.addEventListener("click", async () => {
    clearMessages();

    const p=passwordInput.value;
    const c=confirmInput.value;

    if(p.length<6){
        showError("La password deve contenere almeno 6 caratteri.");
        passwordInput.focus();
        return;
    }
    if(p!==c){
        showError("Le due password non coincidono.");
        confirmInput.focus();
        return;
    }

    saveButton.disabled=true;
    saveButton.textContent="SALVATAGGIO...";

    try{
        const { error }=await client.auth.updateUser({password:p});

        if(error){
            showError(error.message || "Impossibile aggiornare la password.");
            return;
        }

        showOk("Password aggiornata. Puoi tornare alla pagina di accesso.");
        passwordInput.value="";
        confirmInput.value="";

        setTimeout(async()=>{
            await client.auth.signOut();
            window.location.href="index.html";
        },1800);
    }catch(e){
        console.error("Password update error:",e);
        showError("Errore di collegamento al server.");
    }finally{
        saveButton.disabled=false;
        saveButton.textContent="SALVA PASSWORD";
    }
});
</script>
</body>
</html>
