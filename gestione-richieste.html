<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}

table{width:100%;border-collapse:collapse;margin-top:13px;table-layout:fixed}th,td{padding:10px 7px;border-bottom:1px solid #e2e8f0;text-align:center;font-size:14px;vertical-align:middle}th{font-size:11px;text-transform:uppercase;color:#64748b}th:nth-child(1){width:17%}th:nth-child(2){width:16%}th:nth-child(3){width:21%}th:nth-child(4){width:15%}th:nth-child(5){width:31%}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}.pending{background:#fef3c7;color:#92400e}.accepted{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}.mod-status{display:inline-block;margin-top:4px;font-size:10px;font-weight:850;border-radius:999px;padding:4px 7px}.mod-pending{background:#fef3c7;color:#92400e}.mod-approved{background:#dcfce7;color:#166534}.mod-rejected{background:#fee2e2;color:#991b1b}.empty{padding:18px;color:#64748b;font-weight:600}.message{margin-top:10px;padding:9px;border-radius:8px;font-size:12px;font-weight:700}.error{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}.modal.hidden{display:none}.modal-box{background:#fff;border-radius:15px;padding:20px;width:min(620px,100%);max-height:92vh;overflow:auto}h2{margin:0 0 16px;color:#1e3a8a;font-size:20px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail{background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;padding:10px}.detail-label{font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase}.detail-value{margin-top:4px;font-size:14px;font-weight:700;white-space:pre-wrap}.full{grid-column:1/-1}textarea{display:block;width:100%;min-height:95px;margin-top:6px;padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font:inherit;resize:vertical}
.section-title{display:block;color:#1e3a8a;font-size:18px;font-weight:850;letter-spacing:.2px;text-transform:uppercase;line-height:1.2}.history-modal-box{background:#fff;border-radius:15px;padding:20px;width:min(760px,100%);max-height:92vh;overflow:auto}.history-current{background:#f8fafc;border:1px solid #dbe4ef;border-radius:12px;padding:14px;margin-bottom:18px}.history-current-title{font-size:13px;color:#1e3a8a;font-weight:900;text-transform:uppercase;margin-bottom:9px}.history-current-row{font-size:16px;line-height:1.55;font-weight:600}.history-section-title{font-size:13px;color:#1e3a8a;font-weight:900;text-transform:uppercase;margin:18px 0 9px}.history-past-entry{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:11px 12px;margin-bottom:9px}.history-past-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:6px}.history-past-head strong{font-size:13px;color:#1e3a8a}.history-past-head span{font-size:12px;color:#64748b;font-weight:700}.history-past-body{font-size:13px;line-height:1.5}.history-empty{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:13px;color:#64748b;font-weight:700}@media(max-width:700px){.history-modal-box{padding:16px}.history-past-head{align-items:flex-start;flex-direction:column;gap:2px}}.edit-box{display:none;background:#f8fafc;border:1px solid #cbd5e1;border-radius:10px;padding:13px}.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.edit-field label{display:block;font-size:11px;font-weight:800;color:#475569;text-transform:uppercase;margin-bottom:5px}.edit-field input,.edit-field select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font:inherit;font-weight:600}.edit-field.full{grid-column:1/-1}@media(max-width:700px){.edit-grid{grid-template-columns:1fr}}@media(max-width:700px){.detail-grid{grid-template-columns:1fr}table{display:block;overflow-x:auto;white-space:nowrap}th,td{font-size:13px}.header{align-items:flex-start}.full{grid-column:auto}}

<style id="gestore-aesthetic-fix">
/* AZIONI: pulsanti sempre ordinati verticalmente */
.action-stack{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:center;
  gap:7px;
  width:100%;
  min-width:150px;
}
.action-stack button{
  width:100%;
  min-height:38px;
  margin:0!important;
  white-space:nowrap;
}
.requests-table th{padding:13px 10px}
.requests-table td{padding:12px 10px;vertical-align:middle}
.requests-table tbody tr{transition:background .15s ease}
.requests-table tbody tr:hover{background:#f8fafc}
.historyBtn{font-weight:850!important}
.history-modal-box{box-shadow:0 18px 55px rgba(15,23,42,.18)}
.history-current{box-shadow:0 2px 8px rgba(15,23,42,.04)}
.history-past-entry{box-shadow:0 2px 7px rgba(15,23,42,.035)}
.history-section-title{letter-spacing:.15px}
@media(max-width:700px){.action-stack{min-width:0}}
</style>


<style id="hover-fix">
/* Effetto hover sulle richieste */
table tbody tr{
  transition:transform .15s ease, box-shadow .15s ease, background-color .15s ease;
}
table tbody tr:hover{
  background-color:#f1f5f9 !important;
  box-shadow:0 3px 10px rgba(30,58,138,.10);
}
table tbody tr:hover td:first-child{
  border-left:3px solid #1e3a8a;
}

/* Effetto hover sui pulsanti AZIONI */
.action-stack button{
  transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;
}
.action-stack button:hover{
  transform:translateY(-1px);
  filter:brightness(.97);
  box-shadow:0 3px 8px rgba(15,23,42,.14);
}
</style>


<style id="top-buttons-hover-fix">
/* Hover barra superiore: AMMINISTRAZIONE, AGGIORNA, ESCI */

.topbar a,
header button,
header a{
  transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;
}
.topbar button:hover,
.topbar a:hover,
header button:hover,
header a:hover{
  transform:translateY(-1px);
  filter:brightness(.97);
  box-shadow:0 3px 8px rgba(15,23,42,.14);
}
</style>


<style id="aggiorna-blue-fix">

<body>
<header><div class="header"><div><h1>GESTIONE FERIE/PERMESSI</h1><div class="sub" id="managerName">Controllo accesso...</div></div><div class="actions"><button type="button" id="backBtn" class="gray">← AMMINISTRAZIONE</button><button type="button" id="logoutBtn" class="red">ESCI</button></div></div></header>
<main>
<section class="card"><div class="toolbar"><div><strong class="section-title">RICHIESTE RICEVUTE</strong></div><button type="button" id="refreshBtn" class="gray">↻ AGGIORNA</button></div><div id="message"></div>
<table><thead><tr><th>Tecnico</th><th>Tipo</th><th>Data</th><th>Stato</th><th>Azioni</th></tr></thead><tbody id="requestsBody"><tr><td colspan="5">Caricamento...</td></tr></tbody></table>
</section></main>
<div id="historyModal" class="modal hidden"><div class="history-modal-box"><h2>STORICO RICHIESTA</h2><div id="historyContent"></div><div class="actions" style="margin-top:15px"><button type="button" id="closeHistoryBtn" class="gray">CHIUDI</button></div></div></div>
<div id="modal" class="modal hidden"><div class="modal-box"><h2>Dettaglio richiesta</h2><div class="detail-grid">
<div class="detail"><div class="detail-label">Tecnico</div><div id="dTecnico" class="detail-value"></div></div>
<div class="detail"><div class="detail-label">Tipo</div><div id="dTipo" class="detail-value"></div></div>

<div class="detail"><div class="detail-label">Data fine</div><div id="dFine" class="detail-value"></div></div>
<div class="detail"><div class="detail-label">Ora inizio</div><div id="dOraInizio" class="detail-value"></div></div>
<div class="detail"><div class="detail-label">Ora fine</div><div id="dOraFine" class="detail-value"></div></div>
<div class="detail full"><div class="detail-label">Note del tecnico</div><div id="dNoteTecnico" class="detail-value"></div></div>
<div class="detail full"><div class="detail-label">Stato attuale</div><div id="dStato" class="detail-value"></div></div><div id="modificationBox" class="full" style="display:none;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:12px"><div class="detail-label" style="color:#9a3412">MODIFICA IN ATTESA</div><div id="modificationDetails" class="detail-value" style="margin-top:8px"></div><div class="actions" style="margin-top:10px"><button type="button" id="approveModificationBtn" class="green">APPROVA MODIFICA</button><button type="button" id="rejectModificationBtn" class="red">RIFIUTA MODIFICA</button></div></div>

<div class="detail-label" style="color:#1e3a8a;margin-bottom:10px">MODIFICA RICHIESTA</div>
<div class="edit-grid">
<div class="edit-field"><label for="editTipo">Tipo</label><select id="editTipo"><option value="FERIE">FERIE</option><option value="PERMESSO">PERMESSO</option><option value="PERMESSO 104">PERMESSO 104</option></select></div>
<div class="edit-field"></div>
<div class="edit-field"><label for="editDataInizio">Data inizio</label><input id="editDataInizio" type="date"></div>
<div class="edit-field"><label for="editDataFine">Data fine</label><input id="editDataFine" type="date"></div>
<div class="edit-field"><label for="editOraInizio">Ora inizio</label><input id="editOraInizio" type="time"></div>
<div class="edit-field"><label for="editOraFine">Ora fine</label><input id="editOraFine" type="time"></div>
</div>
<div id="managerEditMessage"></div>
<div class="actions" style="margin-top:10px"><button type="button" id="saveManagerEditBtn" class="green">SALVA MODIFICA</button><button type="button" id="cancelManagerEditBtn" class="gray">ANNULLA</button></div>
</div>
<div class="full"><label for="noteGestore" style="font-size:11px;font-weight:800;color:#475569;text-transform:uppercase">Note del gestore</label><textarea id="noteGestore" placeholder="Eventuale comunicazione al tecnico..."></textarea></div><div class="full" id="gestoreSignatureSection">
<label style="font-size:11px;font-weight:800;color:#475569;text-transform:uppercase">Firma per approvazione</label>
<div style="margin-top:6px;background:#fff;border:1px solid #cbd5e1;border-radius:9px;overflow:hidden">
<canvas id="gestoreSignaturePad" style="display:block;width:100%;height:150px;touch-action:none;cursor:crosshair"></canvas>
</div>
<div class="actions" style="margin-top:8px;justify-content:flex-start">
<button type="button" id="clearGestoreSignatureBtn" class="gray">CANCELLA FIRMA</button>
</div>

</div><div class="actions" style="margin-top:15px"><button type="button" id="acceptBtn" class="green">ACCETTA</button><button type="button" id="rejectBtn" class="red">RIFIUTA</button><button type="button" id="closeBtn" class="gray">CHIUDI</button></div><div id="modalMessage"></div></div></div>
<script>
const SUPABASE_URL="https://uojxohvixlcxftpavieu.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_u-ka1YHQS-pTFTIfDsaXcw_3pjStYKh";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let currentProfile=null,requests=[],selectedId=null,managerEditMode=false;
let historyByRequest={};
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function showMessage(text,ok=false){$("message").innerHTML=text?'<div class="message '+(ok?"ok":"error")+'">'+esc(text)+'</div>':"";}
function showModalMessage(text,ok=false){$("modalMessage").innerHTML=text?'<div class="message '+(ok?"ok":"error")+'">'+esc(text)+'</div>':"";}
function fmtDate(v){if(!v)return "—";const p=String(v).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:v;}
function fmtTime(v){return v?String(v).slice(0,5):"—";}
function typeLabel(t){return t==="PERMESSO 104"?"PERMESSO 104":(t||"—");}
function statusBadge(s){if(s==="ACCETTATA")return '<span class="badge accepted">ACCETTATA</span>';if(s==="RIFIUTATA")return '<span class="badge rejected">RIFIUTATA</span>';if(s==="ANNULLATA")return '<span class="badge" style="background:#e2e8f0;color:#475569">ANNULLATA</span>';return '<span class="badge pending">IN ATTESA</span>';}
async function init(){
 try{
  const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;if(!data.session){location.replace("index.html");return;}
  const {data:profile,error:pError}=await supabaseClient.from("profiles").select("id,username,nome,is_admin,is_gestore,attivo").eq("id",data.session.user.id).single();if(pError)throw pError;
  if(profile.attivo!==true||profile.is_admin!==true||profile.is_gestore!==true){document.querySelector("main").innerHTML='<section class="card" style="text-align:center;padding:35px 20px;border-left-color:#dc2626;"><h2 style="color:#b91c1c">ACCESSO NEGATO</h2><p style="font-weight:700;color:#475569">Questa pagina è riservata agli utenti con permessi ADMIN + GESTORE attivi.</p></section>';return;}
  currentProfile=profile;$('managerName').textContent="Gestore: "+(profile.nome||profile.username);await loadRequests();
 }catch(e){showMessage(e.message||"Errore di accesso");}
}
async function loadRequests(){
 showMessage("");$("requestsBody").innerHTML='<tr><td colspan="5">Caricamento...</td></tr>';
 try{
  const {data,error}=await supabaseClient.from("richieste_assenze").select("id,tecnico_id,tipo,data_inizio,data_fine,ora_inizio,ora_fine,stato,note_tecnico,note_gestore,firma_tecnico,firma_gestore,created_at").order("created_at",{ascending:false});
  if(error)throw error;
  const rows=data||[];
  const tecnicoIds=[...new Set(rows.map(r=>r.tecnico_id).filter(Boolean))];
  let profilesById={};
  if(tecnicoIds.length){
   const {data:profiles,error:profilesError}=await supabaseClient.from("profiles").select("id,username,nome,cognome").in("id",tecnicoIds);
   if(profilesError)throw profilesError;
   (profiles||[]).forEach(p=>profilesById[p.id]=p);
  }
  requests=rows.map(r=>Object.assign({},r,{profiles:profilesById[r.tecnico_id]||null}));
  await loadPendingModifications();
   await loadHistory();
  render();
 }catch(e){$("requestsBody").innerHTML='<tr><td colspan="5" class="empty">Errore nel caricamento.</td></tr>';showMessage(e.message||"Errore nel caricamento delle richieste");}
}
let pendingModificationsByRequest={};
let latestModificationsByRequest={};
async function loadPendingModifications(){
  pendingModificationsByRequest={};
  latestModificationsByRequest={};
  const ids=requests.map(r=>r.id);
  if(!ids.length)return;

  const {data,error}=await supabaseClient.from("richieste_assenze_storico")
    .select("id,richiesta_id,modificato_da,modificato_da_tipo,stato,vecchio_tipo,vecchia_data_inizio,vecchia_data_fine,vecchia_ora_inizio,vecchia_ora_fine,vecchia_note_tecnico,nuovo_tipo,nuova_data_inizio,nuova_data_fine,nuova_ora_inizio,nuova_ora_fine,nuova_note_tecnico,created_at,updated_at")
    .in("richiesta_id",ids)
    .eq("modificato_da_tipo","TECNICO")
    .order("created_at",{ascending:false});

  if(error)throw error;

  /*
   * Per ogni richiesta consideriamo SOLO l'ultima modifica.
   * In questo modo una vecchia modifica rimasta IN_ATTESA
   * non può far ricomparire "MODIFICA IN ATTESA" dopo
   * l'approvazione di una modifica successiva.
   */
  (data||[]).forEach(s=>{
    if(!latestModificationsByRequest[s.richiesta_id]){
      latestModificationsByRequest[s.richiesta_id]=s;
    }
  });

  Object.keys(latestModificationsByRequest).forEach(richiestaId=>{
    const latest=latestModificationsByRequest[richiestaId];
    if(latest.stato==="IN_ATTESA"){
      pendingModificationsByRequest[richiestaId]=latest;
    }
  });
}
function modificationText(s){
  const oldDate=s.vecchia_data_inizio===s.vecchia_data_fine
    ?fmtDate(s.vecchia_data_inizio)
    :"dal "+fmtDate(s.vecchia_data_inizio)+" al "+fmtDate(s.vecchia_data_fine);
  const newDate=s.nuova_data_inizio===s.nuova_data_fine
    ?fmtDate(s.nuova_data_inizio)
    :"dal "+fmtDate(s.nuova_data_inizio)+" al "+fmtDate(s.nuova_data_fine);
  const oldTime=s.vecchia_ora_inizio
    ?fmtTime(s.vecchia_ora_inizio)+" - "+fmtTime(s.vecchia_ora_fine)
    :(s.vecchio_tipo==="FERIE"?"-":"Giornata intera");
  const newTime=s.nuova_ora_inizio
    ?fmtTime(s.nuova_ora_inizio)+" - "+fmtTime(s.nuova_ora_fine)
    :(s.nuovo_tipo==="FERIE"?"-":"Giornata intera");

  return '<div style="font-size:16px;line-height:1.55">'+
    ''+
    ''+
    '<div><strong>Tipo:</strong> '+esc(typeLabel(s.nuovo_tipo))+'</div>'+
    '<div><strong>Data:</strong> '+esc(newDate)+'</div>'+
    '<div><strong>Orario:</strong> '+esc(newTime)+'</div>'+
    (s.nuova_note_tecnico?'<div style="margin-top:8px"><strong>Nuova nota:</strong> '+esc(s.nuova_note_tecnico)+'</div>':'')+
    '</div>';
}
async function loadHistory(){
  historyByRequest={};
  const ids=requests.map(r=>r.id);
  if(!ids.length)return;
  const {data,error}=await supabaseClient.from("richieste_assenze_storico")
    .select("id,richiesta_id,modificato_da,modificato_da_tipo,stato,vecchio_tipo,vecchia_data_inizio,vecchia_data_fine,vecchia_ora_inizio,vecchia_ora_fine,nuovo_tipo,nuova_data_inizio,nuova_data_fine,nuova_ora_inizio,nuova_ora_fine,created_at")

function openHistory(id){

    }else if(!scaduta && r.stato!=="ANNULLATA" && latest&&latest.stato==="RIFIUTATA"){

    }else if(!scaduta && r.stato==="IN_ATTESA"){
      action='<button type="button" class="btn manageBtn" data-id="'+esc(r.id)+'">GESTISCI</button>';
    }else if(!scaduta && r.stato==="ACCETTATA"){

    }

    return '<tr><td><strong>'+esc(tecnico)+'</strong></td><td>'+esc(typeLabel(r.tipo))+'</td><td>'+date+(r.ora_inizio?'<br><small>'+fmtTime(r.ora_inizio)+' - '+fmtTime(r.ora_fine)+'</small>':'')+'</td><td>'+statusBadge(r.stato)+modLabel+'</td><td>'+actionsHtml+'</td></tr>';

  document.querySelectorAll(".historyBtn").forEach(btn=>btn.addEventListener("click",()=>openHistory(btn.dataset.id)));

function pdfSafeFileName(value){
  return String(value||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9_-]+/g,"_").replace(/^_+|_+$/g,"");
}

function saveRequestPdf(id){
  const r=requests.find(x=>x.id===id);
  if(!r)return;

  if(!window.jspdf || !window.jspdf.jsPDF){
    showMessage("Impossibile creare il PDF. Ricarica la pagina e riprova.");
    return;
  }

  try{
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
    const prof=r.profiles||{};
    const nome=String(prof.nome||prof.username||"").trim();
    const cognome=String(prof.cognome||"").trim();
    const richiedente=(nome+" "+cognome).trim()||"";
    const created=r.created_at?new Date(r.created_at):new Date();

    const pageW=297;
    const marginL=25;
    const marginR=25;

    doc.setTextColor(0,0,0);
    doc.setDrawColor(0,0,0);

    // Titolo documento
    doc.setFont("times","bold");
    doc.setFontSize(17);
    doc.text("MODULO RICHIESTA FERIE / PERMESSI",pageW/2,28,{align:"center"});

    // Nome richiedente
    doc.setFont("times","bold");
    doc.setFontSize(10);
    doc.text("NOME DEL RICHIEDENTE",marginL,51);
    doc.setFont("times","normal");
    doc.setFontSize(13);
    doc.text(richiedente,74,51);
    doc.line(73,53,145,53);

    // Tipo richiesta con caselle
    const types=[
      {label:"FERIE",value:"FERIE",x:25},
      {label:"PERMESSO",value:"PERMESSO",x:100},
      {label:"PERMESSO 104",value:"PERMESSO 104",x:185}
    ];
    doc.setFont("times","bold");
    doc.setFontSize(10);
    types.forEach(t=>{
      doc.text(t.label,t.x,70);
      doc.rect(t.x+28,66.5,4,4);
      if(r.tipo===t.value){
        doc.setFontSize(14);
        doc.text("X",t.x+28.1,70);
        doc.setFontSize(10);
      }
    });

    // Date / periodo
    doc.setFont("times","bold");
    doc.setFontSize(10);
    if(r.tipo==="FERIE" || r.tipo==="PERMESSO 104"){
      if(r.tipo==="PERMESSO 104" && r.data_inizio===r.data_fine){
        doc.text("IL GIORNO",marginL,90);
        doc.setFont("times","normal");
        doc.setFontSize(13);
        doc.text(fmtDate(r.data_inizio),60,90);
        doc.line(59,92,103,92);
      }else{
        doc.text("DAL GIORNO",marginL,90);
        doc.setFont("times","normal");
        doc.setFontSize(13);
        doc.text(fmtDate(r.data_inizio),60,90);
        doc.line(59,92,103,92);

        doc.setFont("times","bold");
        doc.setFontSize(10);
        doc.text("AL GIORNO",122,90);
        doc.setFont("times","normal");
        doc.setFontSize(13);
        doc.text(fmtDate(r.data_fine),157,90);
        doc.line(156,92,200,92);
      }
    }else{
      doc.text("IL GIORNO",marginL,90);
      doc.setFont("times","normal");
      doc.setFontSize(13);
      doc.text(fmtDate(r.data_inizio),60,90);
      doc.line(59,92,103,92);

      doc.setFont("times","bold");
      doc.setFontSize(10);
      doc.text("DALLE",130,90);
      doc.text("ALLE",177,90);
      doc.setFont("times","normal");
      doc.setFontSize(13);
      doc.text(fmtTime(r.ora_inizio),148,90);
      doc.text(fmtTime(r.ora_fine),195,90);
      doc.line(146,92,165,92);
      doc.line(193,92,212,92);
    }

    // Firma richiedente
    doc.setFont("times","bold");
    doc.setFontSize(10);
    doc.text("FIRMA DEL RICHIEDENTE",marginL,122);
    doc.line(74,123,145,123);

    // Firma del tecnico salvata con la richiesta
    if(r.firma_tecnico){
      try{
        doc.addImage(r.firma_tecnico,"PNG",78,101,55,20,undefined,"FAST");
      }catch(signatureError){
        console.warn("Firma tecnico non visualizzabile nel PDF:",signatureError);
      }
    }

    // Data richiesta
    doc.text("DATA RICHIESTA",marginL,143);
    doc.setFont("times","normal");
    doc.setFontSize(13);
    const requestDate=created.toLocaleDateString("it-IT");
    doc.text(requestDate,74,143);
    doc.line(73,145,145,145);

    // Firma approvazione
    doc.setFont("times","bold");
    doc.setFontSize(10);
    doc.text("FIRMA PER APPROVAZIONE",marginL,164);
    doc.line(74,165,145,165);
    if(r.firma_gestore){
      try{
        doc.addImage(r.firma_gestore,"PNG",78,143,55,20,undefined,"FAST");
      }catch(signatureError){
        console.warn("Firma gestore non visualizzabile nel PDF:",signatureError);
      }
    }

    // Note, se presenti
    if(r.note_tecnico){
      doc.setFont("times","bold");
      doc.setFontSize(10);
      doc.text("NOTE",marginL,184);
      doc.setFont("times","normal");
      doc.setFontSize(11);
      const noteLines=doc.splitTextToSize(String(r.note_tecnico),pageW-marginL-marginR);
      doc.text(noteLines,marginL,191);
    }

    const fileName="Richiesta_"+pdfSafeFileName(r.tipo)+"_"+pdfSafeFileName(richiedente||"Tecnico")+"_"+String(r.data_inizio||"").replaceAll("-","")+".pdf";
    doc.save(fileName);
  }catch(e){
    console.error(e);
    showMessage("Impossibile creare il PDF della richiesta.");
  }
}

async function saveManagerEdit(){
  if(!selectedId)return;
  const r=requests.find(x=>x.id===selectedId);if(!r)return;
  const tipo=$("editTipo").value;
  const dataInizio=$("editDataInizio").value;
  const dataFine=$("editDataFine").value;
  const oraInizio=$("editOraInizio").value||null;
  const oraFine=$("editOraFine").value||null;

  if(!dataInizio||!dataFine){showManagerEditMessage("Inserisci la data di inizio e la data di fine.");return;}
  if(dataFine<dataInizio){showManagerEditMessage("La data fine non può essere precedente alla data inizio.");return;}
  if(tipo==="PERMESSO"&&dataFine!==dataInizio){showManagerEditMessage("Il PERMESSO può essere richiesto per un solo giorno. Per più giorni seleziona FERIE.");return;}
  if((oraInizio&&!oraFine)||(!oraInizio&&oraFine)){showManagerEditMessage("Inserisci entrambe le ore oppure lascia entrambe vuote.");return;}
  if(oraInizio&&oraFine&&oraFine<=oraInizio){showManagerEditMessage("L'ora fine deve essere successiva all'ora inizio.");return;}

  const changed=tipo!==r.tipo||dataInizio!==r.data_inizio||dataFine!==r.data_fine||
    (oraInizio||null)!==(r.ora_inizio?String(r.ora_inizio).slice(0,5):null)||
    (oraFine||null)!==(r.ora_fine?String(r.ora_fine).slice(0,5):null);
  if(!changed){showManagerEditMessage("Non hai apportato modifiche.");return;}

  if(!confirm("Confermi di voler modificare direttamente questa richiesta?"))return;
  showManagerEditMessage("Salvataggio...");
  try{
    const {error:historyError}=await supabaseClient.from("richieste_assenze_storico").insert({
      richiesta_id:r.id,
      modificato_da:currentProfile.id,
      modificato_da_tipo:"GESTORE",
      stato:"APPROVATA",
      vecchio_tipo:r.tipo,
      vecchia_data_inizio:r.data_inizio,
      vecchia_data_fine:r.data_fine,
      vecchia_ora_inizio:r.ora_inizio||null,
      vecchia_ora_fine:r.ora_fine||null,
      vecchia_note_tecnico:r.note_tecnico||null,
      nuovo_tipo:tipo,
      nuova_data_inizio:dataInizio,
      nuova_data_fine:dataFine,
      nuova_ora_inizio:oraInizio,
      nuova_ora_fine:oraFine,
      nuova_note_tecnico:r.note_tecnico||null,
      gestore_id:currentProfile.id,
      nota_gestore:$("noteGestore").value.trim()||null,
      updated_at:new Date().toISOString()
    });
    if(historyError)throw historyError;

    const {error:reqError}=await supabaseClient.from("richieste_assenze").update({
      tipo:tipo,data_inizio:dataInizio,data_fine:dataFine,
      ora_inizio:oraInizio,ora_fine:oraFine,
      gestore_id:currentProfile.id,
      note_gestore:$("noteGestore").value.trim()||null,
      updated_at:new Date().toISOString()
    }).eq("id",r.id);
    if(reqError)throw reqError;

    showManagerEditMessage("Richiesta modificata correttamente.",true);
    await loadRequests();
    setTimeout(closeModal,600);
  }catch(e){showManagerEditMessage(e.message||"Errore nel salvataggio della modifica.");}
}

let gestoreSignatureDrawing=false,gestoreSignatureHasInk=false;
function setupGestoreSignaturePad(){
 const c=$("gestoreSignaturePad");if(!c)return;
 const r=c.getBoundingClientRect(),ratio=devicePixelRatio||1;c.width=Math.max(1,Math.round(r.width*ratio));c.height=Math.max(1,Math.round(r.height*ratio));
 const x=c.getContext("2d");x.setTransform(ratio,0,0,ratio,0,0);x.lineWidth=2;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#0f172a";
 const p=e=>{const q=c.getBoundingClientRect();return{x:e.clientX-q.left,y:e.clientY-q.top}};
 c.onpointerdown=e=>{e.preventDefault();gestoreSignatureDrawing=true;gestoreSignatureHasInk=true;c.setPointerCapture?.(e.pointerId);const p0=p(e);x.beginPath();x.moveTo(p0.x,p0.y)};
 c.onpointermove=e=>{if(!gestoreSignatureDrawing)return;e.preventDefault();const p0=p(e);x.lineTo(p0.x,p0.y);x.stroke()};
 c.onpointerup=e=>{gestoreSignatureDrawing=false;try{c.releasePointerCapture?.(e.pointerId)}catch(_){}};
 c.onpointercancel=c.onpointerup;
}
function clearGestoreSignature(){const c=$("gestoreSignaturePad");if(!c)return;c.getContext("2d").clearRect(0,0,c.width,c.height);gestoreSignatureHasInk=false;showGestoreSignatureMessage("")}
function loadGestoreSignature(v){clearGestoreSignature();if(!v)return;const c=$("gestoreSignaturePad"),img=new Image();img.onload=()=>{const x=c.getContext("2d"),r=c.getBoundingClientRect(),s=Math.min(r.width/img.width,r.height/img.height),w=img.width*s,h=img.height*s;x.drawImage(img,(r.width-w)/2,(r.height-h)/2,w,h);gestoreSignatureHasInk=true};img.src=v}
function getGestoreSignatureBase64(){const c=$("gestoreSignaturePad");if(!c||!gestoreSignatureHasInk)throw new Error("Inserisci la firma del GESTORE prima di approvare la richiesta.");return c.toDataURL("image/png")}

async function updateRequest(newStatus){
