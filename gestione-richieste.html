<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WS Form - Gestione richieste</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{background:#1e3a8a;color:#fff;padding:16px 14px;box-shadow:0 2px 10px #0002}.header{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{margin:0;font-size:21px}.sub{font-size:12px;opacity:.85;margin-top:3px}
main{max-width:1050px;margin:18px auto 60px;padding:0 14px}.card{background:#fff;border-radius:14px;padding:17px;border-left:5px solid #1e3a8a;box-shadow:0 2px 9px #0000000d;margin-bottom:16px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;align-items:center}button{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.btn{background:#1e3a8a;color:#fff}.green{background:#15803d;color:#fff}.gray{background:#e2e8f0;color:#0f172a}.red{background:#dc2626;color:#fff}.orange{background:#d97706;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:13px;table-layout:fixed}th,td{padding:10px 7px;border-bottom:1px solid #e2e8f0;text-align:center;font-size:14px;vertical-align:middle}th{font-size:11px;text-transform:uppercase;color:#64748b}th:nth-child(1){width:17%}th:nth-child(2){width:16%}th:nth-child(3){width:21%}th:nth-child(4){width:15%}th:nth-child(5){width:31%}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}.pending{background:#fef3c7;color:#92400e}.accepted{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}.empty{padding:18px;color:#64748b;font-weight:600}.message{margin-top:10px;padding:9px;border-radius:8px;font-size:12px;font-weight:700}.error{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}.modal.hidden{display:none}.modal-box{background:#fff;border-radius:15px;padding:20px;width:min(620px,100%);max-height:92vh;overflow:auto}h2{margin:0 0 16px;color:#1e3a8a;font-size:20px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail{background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;padding:10px}.detail-label{font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase}.detail-value{margin-top:4px;font-size:14px;font-weight:700;white-space:pre-wrap}.full{grid-column:1/-1}textarea{display:block;width:100%;min-height:95px;margin-top:6px;padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font:inherit;resize:vertical}
.section-title{display:block;color:#1e3a8a;font-size:18px;font-weight:850;letter-spacing:.2px;text-transform:uppercase;line-height:1.2}@media(max-width:700px){.detail-grid{grid-template-columns:1fr}table{display:block;overflow-x:auto;white-space:nowrap}th,td{font-size:13px}.header{align-items:flex-start}.full{grid-column:auto}}
</style>
</head>
<body>
<header><div class="header"><div><h1>GESTIONE FERIE/PERMESSI</h1><div class="sub" id="managerName">Controllo accesso...</div></div><div class="actions"><button type="button" id="backBtn" class="gray">← AMMINISTRAZIONE</button><button type="button" id="logoutBtn" class="red">ESCI</button></div></div></header>
<main>
<section class="card"><div class="toolbar"><div><strong class="section-title">RICHIESTE RICEVUTE</strong></div><button type="button" id="refreshBtn" class="gray">↻ AGGIORNA</button></div><div id="message"></div>
<table><thead><tr><th>Tecnico</th><th>Tipo</th><th>Data</th><th>Stato</th><th>Azioni</th></tr></thead><tbody id="requestsBody"><tr><td colspan="5">Caricamento...</td></tr></tbody></table>
</section></main>
<div id="modal" class="modal hidden"><div class="modal-box"><h2>Dettaglio richiesta</h2><div class="detail-grid">
<div class="detail"><div class="detail-label">Tecnico</div><div id="dTecnico" class="detail-value"></div></div>
<div class="detail"><div class="detail-label">Tipo</div><div id="dTipo" class="detail-value"></div></div>
<div class="detail"><div class="detail-label">Data inizio</div><div id="dInizio" class="detail-value"></div></div>
<div class="detail"><div class="detail-label">Data fine</div><div id="dFine" class="detail-value"></div></div>
<div class="detail"><div class="detail-label">Ora inizio</div><div id="dOraInizio" class="detail-value"></div></div>
<div class="detail"><div class="detail-label">Ora fine</div><div id="dOraFine" class="detail-value"></div></div>
<div class="detail full"><div class="detail-label">Note del tecnico</div><div id="dNoteTecnico" class="detail-value"></div></div>
<div class="detail full"><div class="detail-label">Stato attuale</div><div id="dStato" class="detail-value"></div></div>
<div class="full"><label for="noteGestore" style="font-size:11px;font-weight:800;color:#475569;text-transform:uppercase">Note del gestore</label><textarea id="noteGestore" placeholder="Eventuale comunicazione al tecnico..."></textarea></div>
</div><div class="actions" style="margin-top:15px"><button type="button" id="acceptBtn" class="green">ACCETTA</button><button type="button" id="rejectBtn" class="red">RIFIUTA</button><button type="button" id="closeBtn" class="gray">CHIUDI</button></div><div id="modalMessage"></div></div></div>
<script>
const SUPABASE_URL="https://uojxohvixlcxftpavieu.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_u-ka1YHQS-pTFTIfDsaXcw_3pjStYKh";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let currentProfile=null,requests=[],selectedId=null;
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function showMessage(text,ok=false){$("message").innerHTML=text?'<div class="message '+(ok?"ok":"error")+'">'+esc(text)+'</div>':"";}
function showModalMessage(text,ok=false){$("modalMessage").innerHTML=text?'<div class="message '+(ok?"ok":"error")+'">'+esc(text)+'</div>':"";}
function fmtDate(v){if(!v)return "—";const p=String(v).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:v;}
function fmtTime(v){return v?String(v).slice(0,5):"—";}
function typeLabel(t){return t==="PERMESSO 104"?"PERMESSO 104":(t||"—");}
function statusBadge(s){if(s==="ACCETTATA")return '<span class="badge accepted">ACCETTATA</span>';if(s==="RIFIUTATA")return '<span class="badge rejected">RIFIUTATA</span>';if(s==="ANNULLATA")return '<span class="badge" style="background:#e2e8f0;color:#475569">ANNULLATA</span>';return '<span class="badge pending">IN ATTESA</span>';}
async function init(){
 try{
  const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;if(!data.session){location.replace("index.html");return;}
  const {data:profile,error:pError}=await supabaseClient.from("profiles").select("id,username,nome_tecnico,is_admin,is_gestore,attivo").eq("id",data.session.user.id).single();if(pError)throw pError;
  if(profile.attivo!==true||profile.is_admin!==true||profile.is_gestore!==true){document.querySelector("main").innerHTML='<section class="card" style="text-align:center;padding:35px 20px;border-left-color:#dc2626;"><h2 style="color:#b91c1c">ACCESSO NEGATO</h2><p style="font-weight:700;color:#475569">Questa pagina è riservata agli utenti con permessi ADMIN + GESTORE attivi.</p></section>';return;}
  currentProfile=profile;$('managerName').textContent="Gestore: "+(profile.nome_tecnico||profile.username);await loadRequests();
 }catch(e){showMessage(e.message||"Errore di accesso");}
}
async function loadRequests(){
 showMessage("");$("requestsBody").innerHTML='<tr><td colspan="5">Caricamento...</td></tr>';
 try{
  const {data,error}=await supabaseClient.from("richieste_assenze").select("id,tecnico_id,tipo,data_inizio,data_fine,ora_inizio,ora_fine,stato,note_tecnico,note_gestore,created_at").order("created_at",{ascending:false});
  if(error)throw error;
  const rows=data||[];
  const tecnicoIds=[...new Set(rows.map(r=>r.tecnico_id).filter(Boolean))];
  let profilesById={};
  if(tecnicoIds.length){
   const {data:profiles,error:profilesError}=await supabaseClient.from("profiles").select("id,username,nome_tecnico").in("id",tecnicoIds);
   if(profilesError)throw profilesError;
   (profiles||[]).forEach(p=>profilesById[p.id]=p);
  }
  requests=rows.map(r=>Object.assign({},r,{profiles:profilesById[r.tecnico_id]||null}));
  render();
 }catch(e){$("requestsBody").innerHTML='<tr><td colspan="5" class="empty">Errore nel caricamento.</td></tr>';showMessage(e.message||"Errore nel caricamento delle richieste");}
}
function render(){
 const b=$("requestsBody");if(!requests.length){b.innerHTML='<tr><td colspan="5" class="empty">Nessuna richiesta presente.</td></tr>';return;}
 b.innerHTML=requests.map(r=>{const prof=r.profiles||{};const tecnico=prof.nome_tecnico||prof.username||"Tecnico";const date=r.data_inizio===r.data_fine?fmtDate(r.data_inizio):fmtDate(r.data_inizio)+" → "+fmtDate(r.data_fine);return '<tr><td><strong>'+esc(tecnico)+'</strong></td><td>'+esc(typeLabel(r.tipo))+'</td><td>'+date+(r.ora_inizio?'<br><small>'+fmtTime(r.ora_inizio)+' - '+fmtTime(r.ora_fine)+'</small>':'')+'</td><td>'+statusBadge(r.stato)+'</td><td>'+(r.stato==="IN_ATTESA"?'<button type="button" class="btn manageBtn" data-id="'+esc(r.id)+'">GESTISCI</button>':'—')+'</td></tr>';}).join("");
 document.querySelectorAll(".manageBtn").forEach(btn=>btn.addEventListener("click",()=>openRequest(btn.dataset.id)));
}
function openRequest(id){const r=requests.find(x=>x.id===id);if(!r)return;selectedId=id;$('dTecnico').textContent=(r.profiles?.nome_tecnico||r.profiles?.username||"—");$('dTipo').textContent=typeLabel(r.tipo);$('dInizio').textContent=fmtDate(r.data_inizio);$('dFine').textContent=fmtDate(r.data_fine);$('dOraInizio').textContent=fmtTime(r.ora_inizio);$('dOraFine').textContent=fmtTime(r.ora_fine);$('dNoteTecnico').textContent=r.note_tecnico||"Nessuna nota";$('dStato').innerHTML=statusBadge(r.stato);$('noteGestore').value=r.note_gestore||"";showModalMessage("");const pending=r.stato==="IN_ATTESA";$('acceptBtn').style.display=pending?"inline-block":"none";$('rejectBtn').style.display=pending?"inline-block":"none";$('modal').classList.remove("hidden");}
function closeModal(){$('modal').classList.add("hidden");selectedId=null;showModalMessage("");}
async function updateRequest(newStatus){if(!selectedId)return;const note=$('noteGestore').value.trim();const action=newStatus==="ACCETTATA"?"accettare":"rifiutare";if(!confirm("Confermi di voler "+action+" questa richiesta?"))return;showModalMessage("Salvataggio...");
 try{const {error}=await supabaseClient.from("richieste_assenze").update({stato:newStatus,note_gestore:note,gestore_id:currentProfile.id,updated_at:new Date().toISOString()}).eq("id",selectedId);if(error)throw error;showModalMessage("Richiesta aggiornata.",true);await loadRequests();setTimeout(closeModal,500);}catch(e){showModalMessage(e.message||"Errore nel salvataggio");}}
$('refreshBtn').addEventListener('click',loadRequests);$('acceptBtn').addEventListener('click',()=>updateRequest('ACCETTATA'));$('rejectBtn').addEventListener('click',()=>updateRequest('RIFIUTATA'));$('closeBtn').addEventListener('click',closeModal);$('backBtn').addEventListener('click',()=>location.href='admin.html');$('logoutBtn').addEventListener('click',async()=>{await supabaseClient.auth.signOut();sessionStorage.removeItem('wsform_profile');location.replace('index.html');});$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal();});
init();
</script>
</body></html>
