<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Richieste Ferie/Permessi</title>
    <meta name="theme-color" content="#1e3a8a">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-light: #eff6ff;
            --accent-green: #15803d;
            --accent-red: #b91c1c;
            --accent-gray: #475569;
            --accent-orange: #c2410c;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-color: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 10px;
            padding-bottom: 10px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header-card,
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            margin-bottom: 12px;
        }

        .header-card {
            position: relative;
            padding: 14px;
            text-align: center;
        }

        .header-card h1 {
            color: var(--primary-color);
            font-size: 19px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .header-card h1 {
                font-size: 17px;
                padding: 0 92px;
            }
        }

        @media (max-width: 430px) {
            .header-card h1 {
                font-size: 15px;
                padding: 0 82px;
                letter-spacing: 0;
            }
        }

        .header-card .name {
            font-size: 14px;
            font-weight: 700;
            color: #64748b;
        }

        .header-back-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            border: none;
            background: var(--primary-color);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }

        @media (max-width: 600px) {
            .header-back-btn {
                top: 8px;
                right: 8px;
                padding: 7px 9px;
                font-size: 10px;
            }
        }

        .card {
            padding: 16px;
            border-left: 4px solid var(--primary-color);
        }

        .card h2 {
            color: var(--primary-color);
            font-size: 16px;
            margin-bottom: 14px;
        }

        .field {
            margin-bottom: 14px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        label.field-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 6px;
        }

        select,
        input[type="date"],
        input[type="time"],
        textarea {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 11px 12px;
            background: #fff;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
        }

        select:focus,
        input:focus,
        textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(30,58,138,0.08);
        }

        .choice-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .choice {
            position: relative;
        }

        .choice input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .choice label {
            display: block;
            text-align: center;
            padding: 11px 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            background: #fff;
            cursor: pointer;
        }

        .choice input:checked + label {
            background: var(--primary-light);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .subchoices {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .subchoice {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 9px 11px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #fff;
            font-size: 13px;
            font-weight: 600;
        }

        .subchoice input {
            accent-color: var(--primary-color);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .hidden {
            display: none !important;
        }

        .hint {
            margin-top: 6px;
            font-size: 12px;
            color: #64748b;
        }

        .signature-wrap {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: #fff;
            padding: 8px;
        }

        .signature-canvas {
            display: block;
            width: 100%;
            height: 180px;
            border: 1px dashed #94a3b8;
            border-radius: 8px;
            background: #fff;
            touch-action: none;
            cursor: crosshair;
        }

        .signature-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
        }

        .signature-clear-btn {
            border: 0;
            border-radius: 8px;
            padding: 8px 11px;
            background: #e2e8f0;
            color: #334155;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .signature-hint {
            margin-top: 6px;
            font-size: 11px;
            color: #64748b;
        }

        .primary-btn,
        .secondary-btn {
            width: 100%;
            border: 0;
            border-radius: 9px;
            padding: 12px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }

        .primary-btn {
            background: var(--primary-color);
            color: white;
        }

        .primary-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .secondary-btn {
            background: #e2e8f0;
            color: #334155;
            margin-top: 8px;
        }

        .message {
            display: none;
            padding: 11px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 12px;
            white-space: pre-wrap;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: var(--accent-red);
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: var(--accent-green);
        }

        .request-card {
            border: 1px solid var(--border-color);
            border-radius: 9px;
            padding: 12px;
            margin-bottom: 9px;
            background: #fff;
        }

        .request-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: flex-start;
            margin-bottom: 7px;
        }

        .request-type {
            color: var(--primary-color);
            font-size: 14px;
            font-weight: 800;
        }

        .status {
            display: inline-block;
            border-radius: 999px;
            padding: 4px 8px;
            font-size: 10px;
            font-weight: 800;
            white-space: nowrap;
        }

        .status.waiting {
            background: #fef3c7;
            color: #92400e;
        }

        .status.accepted {
            background: #dcfce7;
            color: #166534;
        }

        .status.rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .request-detail {
            color: #475569;
            font-size: 13px;
            line-height: 1.55;
        }

        .empty {
            color: #64748b;
            font-size: 13px;
            text-align: center;
            padding: 14px 4px;
        }

        .access-denied {
            display: none;
            background: #fee2e2;
            border-left: 4px solid var(--accent-red);
            color: #991b1b;
            padding: 16px;
            border-radius: 10px;
            font-weight: 800;
        }

        .bottom-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.96);
            border-top: 1px solid var(--border-color);
            padding: 9px 10px;
            z-index: 20;
        }

        .bottom-inner {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .bottom-btn {
            border: 0;
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .back-btn {
            background: #e2e8f0;
            color: #334155;
        }

        .logout-btn {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 600px) {
            .choice-grid {
                grid-template-columns: 1fr;
            }

            .row {
                grid-template-columns: 1fr;
            }

            .request-top {
                align-items: flex-start;
            }
        }
    

</style>

<body>
<div class="container">

    <div class="header-card">
        <h1>RICHIESTE FERIE/PERMESSI</h1>
        <div class="name" id="technician-name">Caricamento...</div>
        <button type="button" class="header-back-btn" onclick="location.href='ws-form.html'">← TORNA AL MODULO</button>
    </div>

    <div id="message" class="message"></div>

    <div id="access-denied" class="access-denied">
        ACCESSO NEGATO: questa pagina è riservata agli utenti con permesso TECNICO.
    </div>

    <div id="page-content" class="hidden">

        <div class="card">
            <h2>NUOVA RICHIESTA</h2>

            <div class="field">
                <label class="field-label">TIPO RICHIESTA</label>
                <div class="choice-grid">
                    <div class="choice">
                        <input type="radio" name="tipo" id="tipo-ferie" value="FERIE">
                        <label for="tipo-ferie">FERIE</label>
                    </div>
                    <div class="choice">
                        <input type="radio" name="tipo" id="tipo-permesso" value="PERMESSO">
                        <label for="tipo-permesso">PERMESSO</label>
                    </div>
                    <div class="choice">
                        <input type="radio" name="tipo" id="tipo-104" value="PERMESSO 104">
                        <label for="tipo-104">PERMESSO 104</label>
                    </div>
                </div>
            </div>

            <div id="ferie-fields" class="field hidden">
                <label class="field-label">PERIODO FERIE</label>
                <div class="row">
                    <div>
                        <label class="field-label">Dal</label>
                        <input type="date" id="ferie-inizio">
                    </div>
                    <div>
                        <label class="field-label">Al</label>
                        <input type="date" id="ferie-fine">
                    </div>
                </div>
            </div>

            <div id="permesso-fields" class="field hidden">
                <label class="field-label">PERIODO PERMESSO</label>

                <div class="field">
                    <label class="field-label">Giornata</label>
                    <input type="date" id="permesso-data">
                </div>

                <div class="subchoices">
                    <label class="subchoice">
                        <input type="radio" name="permesso-modalita" value="giornata" checked>
                        Giornata intera
                    </label>
                    <label class="subchoice">
                        <input type="radio" name="permesso-modalita" value="ore">

                    </label>
                </div>

                <div id="permesso-ore" class="row hidden" style="margin-top:10px;">
                    <div>
                        <label class="field-label">Dalle</label>
                        <input type="time" id="permesso-inizio">
                    </div>
                    <div>
                        <label class="field-label">Alle</label>
                        <input type="time" id="permesso-fine">
                    </div>
                </div>
            </div>

            <div id="permesso104-fields" class="field hidden">
                <label class="field-label">PERIODO PERMESSO 104</label>

                <div class="subchoices" style="margin-bottom:10px;">
                    <label class="subchoice">
                        <input type="radio" name="permesso104-modalita" value="giornata" checked>
                        Giornata singola
                    </label>
                    <label class="subchoice">
                        <input type="radio" name="permesso104-modalita" value="periodo">
                        Da / A
                    </label>
                </div>

                <div id="permesso104-giorno">
                    <label class="field-label">Data</label>
                    <input type="date" id="permesso104-data">
                </div>

                <div id="permesso104-periodo" class="row hidden">
                    <div>
                        <label class="field-label">Dal</label>
                        <input type="date" id="permesso104-inizio">
                    </div>
                    <div>
                        <label class="field-label">Al</label>
                        <input type="date" id="permesso104-fine">
                    </div>
                </div>
            </div>

            <div class="field">
                <label class="field-label">NOTE (facoltative)</label>
                <textarea id="note" rows="3" placeholder="Eventuali note..."></textarea>
            </div>

            <div class="field">
                <label class="field-label">FIRMA DEL RICHIEDENTE</label>
                <div class="signature-wrap">
                    <canvas id="signature-canvas" class="signature-canvas"></canvas>
                    <div class="signature-actions">
                        <button type="button" class="signature-clear-btn" id="clear-signature-btn">CANCELLA FIRMA</button>
                    </div>
                    <div class="signature-hint">Firma nello spazio sopra utilizzando il dito sullo smartphone oppure il mouse.</div>
                </div>
            </div>

            <button class="primary-btn" id="submit-btn">INVIA RICHIESTA</button>
        </div>

    </div>
</div>

<script>
    const SUPABASE_URL = "https://uojxohvixlcxftpavieu.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_u-ka1YHQS-pTFTIfDsaXcw_3pjStYKh";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );

    let currentUser = null;
    let currentProfile = null;
    let signatureHasContent = false;
    let signatureDrawing = false;

    const $ = id => document.getElementById(id);

    function showMessage(text, type) {
        const box = $("message");
        box.className = "message " + type;
        box.textContent = text;
        box.style.display = "block";
    }

    function clearMessage() {
        const box = $("message");
        box.className = "message";
        box.textContent = "";
        box.style.display = "none";
    }

    function selectedValue(name) {
        return document.querySelector(`input[name="${name}"]:checked`)?.value || "";
    }

    function formatDate(value) {
        if (!value) return "";
        const [y, m, d] = value.split("-");
        return `${d}/${m}/${y}`;
    }

    function statusLabel(status) {
        if (status === "ACCETTATA") return "ACCETTATA";
        if (status === "RIFIUTATA") return "RIFIUTATA";
        return "IN ATTESA";
    }

    function statusClass(status) {
        if (status === "ACCETTATA") return "accepted";
        if (status === "RIFIUTATA") return "rejected";
        return "waiting";
    }

    function requestPeriod(r) {
        const start = formatDate(r.data_inizio);
        const end = formatDate(r.data_fine);

        if (r.data_inizio !== r.data_fine) {
            return `${start} → ${end}`;
        }

        let result = start;
        if (r.ora_inizio && r.ora_fine) {
            result += ` · ${r.ora_inizio.slice(0,5)} → ${r.ora_fine.slice(0,5)}`;
        } else {
            result += " · Giornata intera";
        }
        return result;
    }

    function setupSignaturePad() {
        const canvas = $("signature-canvas");
        if (!canvas) return;

        const ctx = canvas.getContext("2d");
        ctx.strokeStyle = "#0f172a";
        ctx.lineWidth = 2.2;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        function resizeCanvas(preserve = true) {
            const previous = preserve && canvas.width && canvas.height
                ? canvas.toDataURL("image/png")
                : null;

            const rect = canvas.getBoundingClientRect();
            const dpr = Math.max(window.devicePixelRatio || 1, 1);
            canvas.width = Math.round(rect.width * dpr);
            canvas.height = Math.round(rect.height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            ctx.strokeStyle = "#0f172a";
            ctx.lineWidth = 2.2;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            if (previous && signatureHasContent) {
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0, rect.width, rect.height);
                };
                img.src = previous;
            }
        }

        function pointFromEvent(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        canvas.addEventListener("pointerdown", e => {
            e.preventDefault();
            signatureDrawing = true;
            canvas.setPointerCapture?.(e.pointerId);
            const p = pointFromEvent(e);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            // A tiny dot also counts as a valid signature.
            ctx.lineTo(p.x + 0.01, p.y + 0.01);
            ctx.stroke();
            signatureHasContent = true;
        });

        canvas.addEventListener("pointermove", e => {
            if (!signatureDrawing) return;
            e.preventDefault();
            const p = pointFromEvent(e);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
        });

        const stopDrawing = e => {
            if (!signatureDrawing) return;
            signatureDrawing = false;
            try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
        };

        canvas.addEventListener("pointerup", stopDrawing);
        canvas.addEventListener("pointercancel", stopDrawing);
        canvas.addEventListener("pointerleave", e => {
            if (e.buttons === 0) signatureDrawing = false;
        });

        $("clear-signature-btn").addEventListener("click", () => {
            ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
            signatureHasContent = false;
        });

        resizeCanvas(false);
        window.addEventListener("resize", () => resizeCanvas(true));
    }

    function getSignatureBase64() {
        if (!signatureHasContent) {
            throw new Error("Inserisci la firma del richiedente prima di inviare la richiesta.");
        }

        const canvas = $("signature-canvas");
        return canvas.toDataURL("image/png");
    }

    async function loadProfile() {
        const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();

        if (sessionError || !sessionData.session) {
            showMessage("Sessione non disponibile. Effettua nuovamente il login.", "error");
            return false;
        }

        currentUser = sessionData.session.user;

        const { data: profile, error } = await supabaseClient
            .from("profiles")
            .select("id, username, nome, is_admin, is_tecnico, is_gestore, is_collaboratore, attivo")
            .eq("id", currentUser.id)
            .single();

        if (error || !profile) {
            showMessage("Impossibile caricare il profilo.", error?.message || "");
            return false;
        }

        if (profile.attivo !== true || profile.is_tecnico !== true || profile.is_collaboratore === true) {
            $("access-denied").style.display = "block";
            return false;
        }

        currentProfile = profile;
        $("technician-name").textContent = profile.nome || profile.username || "";
        $("page-content").classList.remove("hidden");
        applyMinimumDates();
        setupSignaturePad();

        return true;
    }

    function updateTypeFields() {
        const tipo = selectedValue("tipo");

        $("ferie-fields").classList.toggle("hidden", tipo !== "FERIE");
        $("permesso-fields").classList.toggle("hidden", tipo !== "PERMESSO");
        $("permesso104-fields").classList.toggle("hidden", tipo !== "PERMESSO 104");
    }

    function updatePermessoHours() {
        $("permesso-ore").classList.toggle("hidden", selectedValue("permesso-modalita") !== "ore");
    }

    function updatePermesso104Mode() {
        const periodo = selectedValue("permesso104-modalita") === "periodo";
        $("permesso104-giorno").classList.toggle("hidden", periodo);
        $("permesso104-periodo").classList.toggle("hidden", !periodo);
    }

    function todayISO() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, "0");
        const d = String(now.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
    }

    function applyMinimumDates() {
        const today = todayISO();
        [
            "ferie-inizio", "ferie-fine",
            "permesso-data",
            "permesso104-data", "permesso104-inizio", "permesso104-fine"
        ].forEach(id => {
            const input = $(id);
            if (input) input.min = today;
        });
    }

    function validateFutureDates(dataInizio, dataFine) {
        const today = todayISO();
        if (dataInizio < today || dataFine < today) {
            throw new Error("Non è possibile richiedere ferie o permessi per date già trascorse. Seleziona una data odierna o futura.");
        }
    }

    function buildPayload() {
        const tipo = selectedValue("tipo");
        if (!tipo) throw new Error("Seleziona il tipo di richiesta.");

        let data_inizio = "";
        let data_fine = "";
        let ora_inizio = null;
        let ora_fine = null;

        if (tipo === "FERIE") {
            data_inizio = $("ferie-inizio").value;
            data_fine = $("ferie-fine").value;

            if (!data_inizio || !data_fine) {
                throw new Error("Inserisci la data di inizio e la data di fine delle ferie.");
            }
        }

        if (tipo === "PERMESSO") {
            data_inizio = $("permesso-data").value;
            data_fine = data_inizio;

            if (!data_inizio) {
                throw new Error("Inserisci la data del permesso.");
            }

            if (selectedValue("permesso-modalita") === "ore") {
                ora_inizio = $("permesso-inizio").value || null;
                ora_fine = $("permesso-fine").value || null;

                if (!ora_inizio || !ora_fine) {
                    throw new Error("Inserisci l'orario dalle/alle.");
                }

                if (ora_fine <= ora_inizio) {
                    throw new Error("L'ora finale deve essere successiva all'ora iniziale.");
                }
            }
        }

        if (tipo === "PERMESSO 104") {
            if (selectedValue("permesso104-modalita") === "giornata") {
                data_inizio = $("permesso104-data").value;
                data_fine = data_inizio;

                if (!data_inizio) {
                    throw new Error("Inserisci la data del permesso 104.");
                }
            } else {
                data_inizio = $("permesso104-inizio").value;
                data_fine = $("permesso104-fine").value;

                if (!data_inizio || !data_fine) {
                    throw new Error("Inserisci la data di inizio e la data di fine del permesso 104.");
                }
            }
        }

        if (data_fine < data_inizio) {
            throw new Error("La data finale non può essere precedente alla data iniziale.");
        }

        validateFutureDates(data_inizio, data_fine);

        return {
            tecnico_id: currentUser.id,
            tipo,
            data_inizio,
            data_fine,
            ora_inizio,
            ora_fine,
            stato: "IN_ATTESA",
            note_tecnico: $("note").value.trim() || null,
            firma_tecnico: getSignatureBase64()
        };
    }

    async function submitRequest() {
        clearMessage();

        const button = $("submit-btn");
        button.disabled = true;

        try {
            const payload = buildPayload();

            const { error } = await supabaseClient
                .from("richieste_assenze")
                .insert(payload);

            if (error) throw new Error(error.message);

            showMessage("Richiesta inviata correttamente.", "success");

            document.querySelectorAll('input[name="tipo"]').forEach(x => x.checked = false);
            $("ferie-inizio").value = "";
            $("ferie-fine").value = "";
            $("permesso-data").value = "";
            $("permesso-inizio").value = "";
            $("permesso-fine").value = "";
            $("permesso104-data").value = "";
            $("permesso104-inizio").value = "";
            $("permesso104-fine").value = "";
            $("note").value = "";

            const signatureCanvas = $("signature-canvas");
            if (signatureCanvas) {
                const signatureCtx = signatureCanvas.getContext("2d");
                signatureCtx.clearRect(0, 0, signatureCanvas.clientWidth, signatureCanvas.clientHeight);
            }
            signatureHasContent = false;

            updateTypeFields();

        } catch (error) {
            showMessage("Richiesta non inviata.\n\n" + (error.message || error), "error");
        } finally {
            button.disabled = false;
        }
    }

    async function logout() {
        await supabaseClient.auth.signOut();
        window.location.href = "index.html";
    }

    document.querySelectorAll('input[name="tipo"]').forEach(x => {
        x.addEventListener("change", updateTypeFields);
    });

    document.querySelectorAll('input[name="permesso-modalita"]').forEach(x => {
        x.addEventListener("change", updatePermessoHours);
    });

    document.querySelectorAll('input[name="permesso104-modalita"]').forEach(x => {
        x.addEventListener("change", updatePermesso104Mode);
    });

    $("submit-btn").addEventListener("click", submitRequest);

    (async function init() {
        const ok = await loadProfile();
        if (!ok) return;

    })();
</script>
</body>
</html>
