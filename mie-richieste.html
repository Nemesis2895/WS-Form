<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WS Form - Le tue richieste</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:12px}
.container{max-width:1100px;margin:auto}.header-card,.card{background:#fff;border-radius:14px;box-shadow:0 2px 9px #0000000d;border-left:5px solid #1e3a8a}
.header-card{padding:18px;margin-bottom:16px;text-align:center;position:relative}.header-card h1{margin:0;color:#1e3a8a;font-size:21px;font-weight:800}.name{margin-top:6px;color:#64748b;font-size:13px;font-weight:700}.back-btn{position:absolute;right:14px;top:14px;border:0;border-radius:8px;background:#e2e8f0;color:#334155;padding:9px 12px;font-size:11px;font-weight:800;cursor:pointer}
.card{padding:17px;overflow:hidden}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.toolbar strong{font-size:15px;color:#1e3a8a}.refresh{border:0;border-radius:8px;background:#e2e8f0;color:#334155;padding:9px 12px;font-size:11px;font-weight:800;cursor:pointer}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:11px 8px;border-bottom:1px solid #e2e8f0;text-align:center;font-size:13px;vertical-align:middle}th{font-size:10px;text-transform:uppercase;color:#64748b;background:#f8fafc}td{font-weight:600}.empty{text-align:center;color:#64748b;padding:25px;font-size:12px;font-weight:600}.error{margin-bottom:12px;padding:10px;border-radius:8px;background:#fee2e2;color:#991b1b;font-size:12px;font-weight:700}.status{display:inline-block;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:800}.pending{background:#fef3c7;color:#92400e}.accepted{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}.cancelled{background:#e2e8f0;color:#475569}.cancel-btn{border:0;border-radius:8px;background:#fee2e2;color:#991b1b;padding:7px 9px;font-size:10px;font-weight:800;cursor:pointer;white-space:nowrap}.cancel-btn:hover{background:#fecaca}.note{text-align:center;white-space:pre-wrap;max-width:260px;margin:auto;font-size:12px;color:#475569}.small{font-size:11px;color:#64748b;font-weight:600}
@media(max-width:700px){body{padding:8px}.header-card{padding:16px 12px 58px}.back-btn{top:auto;bottom:12px;right:12px}.header-card h1{font-size:18px}.card{padding:12px}.toolbar{align-items:flex-start}}
</style>
</head>
<body>
<div class="container">
  <div class="header-card">
    <h1>LE TUE RICHIESTE</h1>
    <div class="name" id="technician-name">Caricamento...</div>
    <button type="button" class="back-btn" onclick="location.href='ws-form.html'">← TORNA AL MODULO</button>
  </div>

  <div id="error" class="error" style="display:none"></div>

  <div class="card">
    <div class="toolbar">
      <strong>RICHIESTE FERIE/PERMESSI</strong>
      <button type="button" class="refresh" id="refresh-btn">↻ AGGIORNA</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Tipo</th>
            <th>Data</th>
            <th>Orario</th>
            <th>Stato</th>
            <th>Note Tecnico</th>
            <th>Note Gestore</th>
            <th>Richiesta del</th>
            <th>Azioni</th>
          </tr>
        </thead>
        <tbody id="requests-body">
          <tr><td colspan="8" class="empty">Caricamento richieste...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<script>
const SUPABASE_URL="https://uojxohvixlcxftpavieu.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_u-ka1YHQS-pTFTIfDsaXcw_3pjStYKh";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let currentUser=null;
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function formatDate(v){if(!v)return "";const p=v.split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v;}
function formatDateTime(v){if(!v)return "";const d=new Date(v);if(Number.isNaN(d.getTime()))return "";return d.toLocaleString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function statusBadge(stato){const s=stato||"IN_ATTESA";if(s==="ACCETTATA")return '<span class="status accepted">ACCETTATA</span>';if(s==="RIFIUTATA")return '<span class="status rejected">RIFIUTATA</span>';if(s==="ANNULLATA")return '<span class="status cancelled">ANNULLATA</span>';return '<span class="status pending">IN ATTESA</span>';}
function typeLabel(tipo){return tipo==="PERMESSO 104"?"PERMESSO 104":(tipo||"");}
function dateLabel(r){if(r.data_inizio===r.data_fine)return formatDate(r.data_inizio);return `${formatDate(r.data_inizio)} – ${formatDate(r.data_fine)}`;}
function timeLabel(r){if(r.ora_inizio&&r.ora_fine)return `${String(r.ora_inizio).slice(0,5)} – ${String(r.ora_fine).slice(0,5)}`;return '<span class="small">—</span>';}
function showError(msg){$("error").textContent=msg||"Errore";$("error").style.display="block";}
function clearError(){$("error").style.display="none";$("error").textContent="";}
async function loadProfile(){
  const {data,error}=await supabaseClient.auth.getSession();
  if(error)throw error;if(!data.session){location.replace("index.html");return false;}
  currentUser=data.session.user;
  const {data:profile,error:pError}=await supabaseClient.from("profiles").select("id,username,nome_tecnico,is_tecnico,attivo").eq("id",currentUser.id).single();
  if(pError)throw pError;
  if(!profile||profile.attivo!==true||profile.is_tecnico!==true){showError("ACCESSO NEGATO: questa pagina è riservata agli utenti con permesso TECNICO.");return false;}
  $("technician-name").textContent=profile.nome_tecnico||profile.username||"";
  return true;
}
async function cancelRequest(id){
  if(!id)return;
  const conferma=confirm("Vuoi davvero cancellare questa richiesta?\n\nLa richiesta verrà impostata come ANNULLATA e resterà nello storico.");
  if(!conferma)return;

  clearError();
  try{
    const {error}=await supabaseClient
      .from("richieste_assenze")
      .update({stato:"ANNULLATA",updated_at:new Date().toISOString()})
      .eq("id",id)
      .eq("tecnico_id",currentUser.id)
      .eq("stato","IN_ATTESA");

    if(error)throw error;
    await loadRequests();
  }catch(e){
    showError(e.message||"Impossibile cancellare la richiesta.");
  }
}

async function loadRequests(){
  clearError();
  $("requests-body").innerHTML='<tr><td colspan="8" class="empty">Caricamento richieste...</td></tr>';
  try{
    const {data,error}=await supabaseClient.from("richieste_assenze").select("id,tipo,data_inizio,data_fine,ora_inizio,ora_fine,stato,note_tecnico,note_gestore,created_at").eq("tecnico_id",currentUser.id).order("created_at",{ascending:false});
    if(error)throw error;
    if(!data||!data.length){$("requests-body").innerHTML='<tr><td colspan="8" class="empty">Non hai ancora inviato nessuna richiesta.</td></tr>';return;}
    $("requests-body").innerHTML=data.map(r=>`<tr><td>${esc(typeLabel(r.tipo))}</td><td>${esc(dateLabel(r))}</td><td>${timeLabel(r)}</td><td>${statusBadge(r.stato)}</td><td><div class="note">${esc(r.note_tecnico||"—")}</div></td><td><div class="note">${esc(r.note_gestore||"—")}</div></td><td>${esc(formatDateTime(r.created_at))}</td><td>${r.stato==="IN_ATTESA"?`<button type="button" class="cancel-btn" onclick="cancelRequest('${esc(r.id)}')">CANCELLA RICHIESTA</button>`:"—"}</td></tr>`).join("");
  }catch(e){$("requests-body").innerHTML='<tr><td colspan="8" class="empty">Impossibile caricare le richieste.</td></tr>';showError(e.message||"Errore nel caricamento delle richieste.");}
}
$("refresh-btn").addEventListener("click",loadRequests);
(async function(){try{if(await loadProfile())await loadRequests();}catch(e){showError(e.message||"Errore di accesso.");}})();
</script>
</body>
</html>
